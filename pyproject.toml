[project]
name = "sensor-fusion-kalman-1d"
version = "0.1.0"
description = "1-D Kalman filter fusing an incubator's chamber sensor, ambient sensor and heater state."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
